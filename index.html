        <h1 class="logo">PUTAR!</h1>
        <p class="tagline">Ketuk untuk pindah lintasan. Hindari duri, sapu kilau.</p>
        <button id="btn-play" class="btn primary big"><svg class="ic" aria-hidden="true"><use href="#i-play"/></svg>Main</button>
        <button id="btn-ballbar" class="ballbar" aria-label="Koleksi bola">
          <span class="ballbar-top"><span id="ballbar-text">Bola baru</span><b id="ballbar-num"></b></span>
          <span class="bar"><i id="ballbar-fill"></i></span>
        </button>
        <nav class="home-menu">
          <button id="btn-missions" class="menu-btn"><svg class="ic" aria-hidden="true"><use href="#i-target"/></svg><span>Misi</span><i class="dot hidden" id="missions-dot"></i></button>
          <button id="btn-daily" class="menu-btn"><svg class="ic" aria-hidden="true"><use href="#i-gift"/></svg><span>Hadiah</span><i class="dot hidden" id="daily-dot"></i></button>
          <button id="btn-balls" class="menu-btn"><svg class="ic" aria-hidden="true"><use href="#i-orbit"/></svg><span>Koleksi</span></button>
          <button id="btn-shop" class="menu-btn"><svg class="ic" aria-hidden="true"><use href="#i-shield"/></svg><span>Toko</span></button>
        </nav>
        <button id="btn-help" class="link-btn"><svg class="ic" aria-hidden="true"><use href="#i-help"/></svg>Cara main</button>
      </section>
      <canvas id="cv" class="play-only" aria-label="Papan permainan"></canvas>
      <div id="ready-bar" class="ready-bar hidden"></div>
      <div id="banner" class="banner hidden" aria-live="polite">
        <svg class="ic big-ic" aria-hidden="true"><use href="#i-tap"/></svg>
        <h2 id="banner-title">Cara main</h2>
        <p id="banner-text">Ketuk di mana saja untuk pindah lintasan. Hindari duri merah, sapu kilau berturut-turut untuk combo.</p>
        <button id="btn-start" class="btn primary">Mengerti</button>
      </div>
    </main>
  </div>

  <div id="toast" class="toast hidden" role="status"></div>

  <!-- Modals: one visible at a time, see showModal() -->
  <div id="modal" class="overlay hidden">
    <div class="card" id="card" role="dialog" aria-modal="true"></div>
  </div>

  <script src="js/engine.js"></script>
  <script src="js/meta.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/ads-config.js"></script>
  <script src="js/native.js"></script>
  <script src="js/ads.js"></script>
  <script src="js/game.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
    }
  </script>
</body>
</html>
